
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar una mesa | Lora's Coffe</title>
  <meta name="description" content="Reserva tu mesa en Lora's Coffe.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <style>
    .reserva-pagina {
      max-width: var(--ancho);
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    .reserva-contenido {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 48px;
    }

    .reserva-portada {
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 6px;
    }

    .reserva-intro h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      margin-bottom: 14px;
    }

    .reserva-intro p {
      margin-bottom: 24px;
    }

    .form-reserva-pagina {
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 28px;
      display: grid;
      gap: 18px;
    }

    @media (max-width: 800px) {
      .reserva-contenido {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .reserva-portada {
        max-height: 360px;
      }
    }
  </style>
</head>

<body>

  <a class="skip" href="#contenido">Saltar al contenido</a>

  <!-- ENCABEZADO -->
  <header class="header">
    <div class="header-inner">

      <a class="logo" href="index.html">
        <img src="img/Logotipo elegante de café y loro.png" alt="Lora's Coffe">
      </a>

      <nav class="nav" aria-label="Principal">
        <a href="index.html#productos">Productos</a>
        <a href="index.html#galeria">Galería</a>
        <a href="index.html#sucursales">Sucursales</a>
        <a href="index.html#contacto">Contacto</a>
      </nav>

      <a class="btn btn-header" href="index.html">Volver al inicio</a>

    </div>
  </header>

  <!-- RESERVAR MESA -->
  <main id="contenido" class="reserva-pagina">

    <div class="reserva-contenido">

      <!-- IMAGEN -->
      <div>
        <img
          class="reserva-portada"
          src="img/Reserva tu mesa en Lora’s Coffe (1).png"
          alt="Reserva tu mesa en Lora's Coffe">
      </div>

      <!-- FORMULARIO -->
      <div class="reserva-intro">

        <h1>Reserva tu mesa</h1>

        <p>
          Completa tus datos y nos pondremos en contacto contigo
          por WhatsApp para confirmar tu reserva.
        </p>

        <form class="form-reserva-pagina" id="form-reserva">

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              autocomplete="name"
              required>
          </div>

          <div class="fila">

            <div class="campo">
              <label for="fecha">Fecha</label>
              <input
                type="date"
                id="fecha"
                name="fecha"
                required>
            </div>

            <div class="campo">
              <label for="hora">Hora</label>
              <input
                type="time"
                id="hora"
                name="hora"
                required>
            </div>

          </div>

          <div class="fila">

            <div class="campo">
              <label for="personas">Personas</label>

              <select id="personas" name="personas" required>
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8 o más">8 o más</option>
              </select>
            </div>

            <div class="campo">
              <label for="sucursal">Sucursal</label>

              <select id="sucursal" name="sucursal" required>
                <option value="Sucursal 1 (Centro)">
                  Sucursal 1 (Centro)
                </option>
                <option value="Sucursal 2 (Norte)">
                  Sucursal 2 (Norte)
                </option>
              </select>
            </div>

          </div>

          <button class="btn" type="submit">
            Enviar reserva por WhatsApp
          </button>

        </form>

      </div>
    </div>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="footer">
    <p class="copy">
      © 2026 Lora's Coffe. Todos los derechos reservados.
    </p>
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    document.getElementById("form-reserva").addEventListener("submit", function(event) {

      event.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const fecha = document.getElementById("fecha").value;
      const hora = document.getElementById("hora").value;
      const personas = document.getElementById("personas").value;
      const sucursal = document.getElementById("sucursal").value;

      const mensaje =
        "Hola, quisiera reservar una mesa en Lora's Coffe.\n" +
        "Nombre: " + nombre + "\n" +
        "Fecha: " + fecha + "\n" +
        "Hora: " + hora + "\n" +
        "Personas: " + personas + "\n" +
        "Sucursal: " + sucursal;

      // Reemplazar por el número real de WhatsApp.
      window.open(
        "https://wa.me/5910000000?text=" + encodeURIComponent(mensaje),
        "_blank"
      );

    });
  </script>

</body>
</html>
